[project]
name = "blocks-service"
version = "0.5.0"
description = "Authoritative domain, data, synchronization, and device-coordination service for Blocks."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# Fixtures must share the test's event loop. With a session-scoped fixture loop,
# the connection pool `client` opens has its worker tasks on a loop that is not
# running during the test, so the pool can never grow past the one connection it
# pre-opened -- every request serialises and no concurrency test can observe a
# race. Both async fixtures here are function-scoped; `settings` is synchronous.
asyncio_default_fixture_loop_scope = "function"
